name: Publish research dashboard
on:
  push:
    branches: [master, codex/pages-dashboard]
    paths:
      - dashboard/**
      - build_dashboard.py
      - agent_tool.py
      - review_server.py
      - tests/test_dashboard.py
      - .github/workflows/dashboard-pages.yml
  pull_request:
    paths:
      - dashboard/**
      - build_dashboard.py
      - agent_tool.py
      - review_server.py
      - tests/test_dashboard.py
      - .github/workflows/dashboard-pages.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m pytest tests/ -q
      - run: python3 build_dashboard.py --output dist
      - name: Package static dashboard
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: nhl-dashboard-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy static dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
